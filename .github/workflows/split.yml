# Split 의 최신 GitHub 릴리스를 보고 Casks/split.rb 의 버전과 sha256 을 맞춘다.
# Split 릴리스는 GitHub Actions 에서 나가는데, 그 토큰으로는 이 저장소에 쓸 수 없어서
# 이쪽에서 30분마다 확인한다. 바로 맞추고 싶으면 Actions 에서 손으로 돌린다.
name: Update Split

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-split
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo RUNNERS-IM/split --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/split.rb)
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "이미 $VERSION 입니다."
            exit 0
          fi
          gh release download "$TAG" --repo RUNNERS-IM/split --pattern "Split-$VERSION.dmg" --dir "$RUNNER_TEMP"
          SHA=$(sha256sum "$RUNNER_TEMP/Split-$VERSION.dmg" | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"$/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" Casks/split.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "split $VERSION"
          git push
