# Draw 의 최신 GitHub 릴리스를 보고 Casks/draw.rb 를 그 버전으로 다시 쓴다.
# Draw 릴리스는 GitHub Actions 에서 나가는데, 그 토큰으로는 이 저장소에 쓸 수 없어서
# 이쪽에서 30분마다 확인한다. 다른 앱 작업(매시 0 · 30분)과 push 가 부딪치지 않게 15 · 45분에 돈다. 바로 맞추고 싶으면 Actions 에서 손으로 돌린다.
#
# DMG 가 CPU 마다 하나씩(Draw-<태그>-mac-arm64.dmg, -x64.dmg) 나와서
# 두 파일의 sha256 을 모두 받아 cask 를 통째로 다시 쓴다.
name: Update Draw

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-draw
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo RUNNERS-IM/draw --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/draw.rb)
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "이미 $VERSION 입니다."
            exit 0
          fi
          gh release download "$TAG" --repo RUNNERS-IM/draw --pattern "Draw-$VERSION-mac-*.dmg" --dir "$RUNNER_TEMP"
          ARM=$(sha256sum "$RUNNER_TEMP/Draw-$VERSION-mac-arm64.dmg" | cut -d' ' -f1)
          INTEL=$(sha256sum "$RUNNER_TEMP/Draw-$VERSION-mac-x64.dmg" | cut -d' ' -f1)
          cat > Casks/draw.rb <<CASK
          cask "draw" do
            arch arm: "arm64", intel: "x64"

            version "$VERSION"
            sha256 arm:   "$ARM",
                   intel: "$INTEL"

            url "https://github.com/RUNNERS-IM/draw/releases/download/v#{version}/Draw-#{version}-mac-#{arch}.dmg"
            name "Draw"
            desc "Screen annotation tool for presentations and screen sharing"
            homepage "https://github.com/RUNNERS-IM/draw"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: :monterey

            app "Draw.app"

            zap trash: [
              "~/Library/Application Support/Draw",
              "~/Library/Application Support/im.runners.draw",
              "~/Library/Caches/im.runners.draw",
              "~/Library/Caches/im.runners.draw.ShipIt",
              "~/Library/Logs/Draw",
              "~/Library/Preferences/im.runners.draw.plist",
              "~/Library/Saved Application State/im.runners.draw.savedState",
              "~/Library/WebKit/im.runners.draw",
            ]
          end
          CASK
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "draw $VERSION"
          git push
